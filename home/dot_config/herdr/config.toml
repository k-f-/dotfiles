onboarding = false

[ui.sound]
enabled = false

[ui]
agent_panel_sort = "spaces"

[ui.sidebar.agents]
rows = [
  ["state_icon", { token = "tab", bold = true }],
]

# Worktrees live outside iCloud on purpose. ~/Documents is iCloud-synced to
# both Macs, and a worktree's .git file points back into the main repo's
# .git/worktrees/ -- two machines syncing that metadata corrupts it.
[worktrees]
directory = "~/.local/state/herdr/worktrees"
